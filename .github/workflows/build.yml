name: Build OpenWrt Custom Firmware

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Official OpenWrt tag (e.g., v25.12.5)'
        required: true
        default: 'v25.12.5'

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout custom repository
        uses: actions/checkout@v4

      # ============================================================
      # Dependencies
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ccache \
            ecj \
            fastjar \
            file \
            g++ \
            gawk \
            gettext \
            git \
            java-propose-classpath \
            libelf-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pyelftools \
            unzip \
            wget \
            python3-setuptools \
            rsync \
            subversion \
            swig \
            time \
            xsltproc \
            zlib1g-dev

      # ============================================================
      # Clone official OpenWrt
      # ============================================================

      - name: Clone official OpenWrt
        run: |
          echo "========================================"
          echo "OPENWRT VERSION"
          echo "========================================"

          echo "Requested tag: ${{ github.event.inputs.branch }}"

          git clone \
            --depth 1 \
            https://github.com/openwrt/openwrt.git \
            -b "${{ github.event.inputs.branch }}" \
            openwrt

          cd openwrt

          echo
          echo "OpenWrt commit:"
          git log -1 --format='%H'

          echo
          echo "OpenWrt revision:"
          git log -1 --oneline

          echo
          echo "OpenWrt tag:"
          git describe --tags --always

          if [ ! -f "scripts/feeds" ]; then
            echo "::error::OpenWrt clone failed!"
            exit 1
          fi

      # ============================================================
      # Copy custom files
      # ============================================================

      - name: Copy custom files
        run: |
          if [ -d "custom" ] && [ "$(ls -A custom)" ]; then
            echo "========================================"
            echo "COPYING CUSTOM FILES"
            echo "========================================"

            rsync -av custom/ openwrt/
          else
            echo "WARNING: custom/ folder is missing or empty."
          fi

      # ============================================================
      # Show custom GTW360 files
      # ============================================================

      - name: Inspect GTW360 custom files
        run: |
          cd openwrt

          echo "========================================"
          echo "GTW360 CUSTOM FILES"
          echo "========================================"

          echo
          echo "--- target/linux/imx ---"

          find target/linux/imx \
            -maxdepth 6 \
            -type f \
            -print \
            | sort

          echo
          echo "--- GTW360 references ---"

          grep -R -n \
            -E 'gtw360|sdma-imx6q|sdma-imx7d|CONFIG_EXTRA_FIRMWARE|DEVICE_PACKAGES' \
            target/linux/imx \
            2>/dev/null || true

      # ============================================================
      # Feeds
      # ============================================================

      - name: Update and install feeds
        run: |
          cd openwrt

          echo "========================================"
          echo "UPDATING FEEDS"
          echo "========================================"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # Generate .config
      # ============================================================

      - name: Generate configuration
        run: |
          cd openwrt

          echo "========================================"
          echo "GENERATING OPENWRT CONFIG"
          echo "========================================"

          cat << 'EOF' > .config
          CONFIG_TARGET_imx=y
          CONFIG_TARGET_imx_cortexa7=y
          CONFIG_TARGET_imx_cortexa7_DEVICE_geniatech_gtw360=y

          CONFIG_PACKAGE_kmod-brcmfmac=y
          CONFIG_PACKAGE_kmod-button-hotplug=y
          CONFIG_PACKAGE_kmod-input-gpio-keys=y
          CONFIG_PACKAGE_kmod-leds-gpio=y
          CONFIG_PACKAGE_kmod-pps-gpio=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-phy-micrel=y
          CONFIG_PACKAGE_wpa-supplicant=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_hostapd=y
          CONFIG_PACKAGE_kmod-bluetooth=y
          CONFIG_PACKAGE_bluez-daemon=y
          CONFIG_PACKAGE_bluez-libs=y
          CONFIG_PACKAGE_bluez-utils=y
          EOF

          make defconfig

          echo
          echo "========================================"
          echo "FINAL OPENWRT CONFIG"
          echo "========================================"

          grep '^CONFIG_TARGET_' .config | sort

          echo
          echo "========================================"
          echo "SELECTED PACKAGES"
          echo "========================================"

          grep '^CONFIG_PACKAGE_' .config | sort

      # ============================================================
      # Inspect SDMA configuration
      # ============================================================

      - name: Inspect SDMA configuration
        run: |
          cd openwrt

          echo "========================================"
          echo "SDMA CONFIGURATION"
          echo "========================================"

          echo
          echo "--- Search entire target/linux tree ---"

          grep -R -n \
            -E 'CONFIG_EXTRA_FIRMWARE|sdma-imx6q|sdma-imx7d|CONFIG_IMX_SDMA' \
            target/linux/imx \
            target/linux/generic \
            2>/dev/null || true

          echo
          echo "--- config-default files ---"

          find target/linux/imx \
            -name 'config-default' \
            -type f \
            -print \
            -exec sh -c '
              echo "===== $1 ====="
              grep -E "CONFIG_EXTRA_FIRMWARE|CONFIG_IMX_SDMA" "$1" || true
            ' _ {} \;

      # ============================================================
      # Download sources
      # ============================================================

      - name: Download sources
        run: |
          cd openwrt

          echo "========================================"
          echo "DOWNLOADING SOURCES"
          echo "========================================"

          make download -j$(nproc)

          find dl -size -1024c -exec rm -f {} \;

      # ============================================================
      # Prepare kernel
      # ============================================================

      - name: Prepare kernel
        run: |
          cd openwrt

          echo "========================================"
          echo "PREPARING KERNEL"
          echo "========================================"

          make target/linux/prepare V=s

      # ============================================================
      # Configure kernel
      # ============================================================

      - name: Configure kernel
        run: |
          cd openwrt

          echo "========================================"
          echo "CONFIGURING KERNEL"
          echo "========================================"

          make target/linux/configure V=s

      # ============================================================
      # Kernel diagnostics
      # ============================================================

      - name: Inspect generated kernel configuration
        run: |
          cd openwrt

          echo "========================================"
          echo "LOCATING KERNEL"
          echo "========================================"

          KDIR="$(
            find build_dir \
              -type d \
              -path '*/linux-6.12.94' \
              | head -n1
          )"

          echo "KDIR=$KDIR"

          if [ -z "$KDIR" ]; then
            echo "::error::Kernel directory not found"
            exit 1
          fi

          echo
          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          if [ -f "$KDIR/Makefile" ]; then
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' \
              "$KDIR/Makefile" || true
          fi

          echo
          echo "========================================"
          echo "KERNEL .CONFIG"
          echo "========================================"

          if [ ! -f "$KDIR/.config" ]; then
            echo "::error::Kernel .config does not exist"
            exit 1
          fi

          echo "Kernel config:"
          echo "$KDIR/.config"

          echo
          echo "--- SDMA / FIRMWARE ---"

          grep -E \
            'CONFIG_(EXTRA_FIRMWARE|IMX_SDMA)' \
            "$KDIR/.config" \
            || true

          echo
          echo "--- EXTRA FIRMWARE COMPLETE ---"

          grep 'CONFIG_EXTRA_FIRMWARE' \
            "$KDIR/.config" \
            || true

          echo
          echo "--- MODULE CONFIG ---"

          grep -E \
            '^CONFIG_(BRCMFMAC|BUTTON|INPUT_GPIO|LEDS_GPIO|PPS_GPIO|SCSI|MMC|BT|BLUETOOTH|PHY)' \
            "$KDIR/.config" \
            || true

          echo
          echo "========================================"
          echo "KERNEL CONFIG STATISTICS"
          echo "========================================"

          echo "Total config lines:"
          wc -l "$KDIR/.config"

          echo
          echo "Built-in (=y):"
          grep -c '=y' "$KDIR/.config" || true

          echo
          echo "Modules (=m):"
          grep -c '=m' "$KDIR/.config" || true

      # ============================================================
      # Kernel config.set diagnostics
      # ============================================================

      - name: Inspect kernel config.set
        run: |
          cd openwrt

          echo "========================================"
          echo "CONFIG.SET"
          echo "========================================"

          KDIR="$(
            find build_dir \
              -type d \
              -path '*/linux-6.12.94' \
              | head -n1
          )"

          if [ -z "$KDIR" ]; then
            echo "::error::Kernel directory not found"
            exit 1
          fi

          echo "KDIR=$KDIR"

          if [ -f "$KDIR/.config.set" ]; then
            echo
            echo "--- .config.set exists ---"

            wc -l "$KDIR/.config.set"

            echo
            echo "--- SDMA / FIRMWARE ---"

            grep -E \
              'CONFIG_(EXTRA_FIRMWARE|IMX_SDMA)' \
              "$KDIR/.config.set" \
              || true

            echo
            echo "--- CONFIG.SET HASH ---"

            grep '=[ym]' "$KDIR/.config.set" \
              | LC_ALL=C sort \
              | md5sum

          else
            echo "WARNING: .config.set does not exist yet."
            echo "This may be generated later during the build."
          fi

      # ============================================================
      # Build kernel first
      # ============================================================

      - name: Compile kernel
        run: |
          cd openwrt

          echo "========================================"
          echo "COMPILING KERNEL"
          echo "========================================"

          make target/linux/compile -j$(nproc) V=s

      # ============================================================
      # Inspect vermagic AFTER kernel compilation
      # ============================================================

      - name: Verify kernel ABI
        run: |
          cd openwrt

          echo "========================================"
          echo "KERNEL ABI / VERMAGIC"
          echo "========================================"

          KDIR="$(
            find build_dir \
              -type d \
              -path '*/linux-6.12.94' \
              | head -n1
          )"

          echo "KDIR=$KDIR"

          echo
          echo "--- .vermagic ---"

          if [ -f "$KDIR/.vermagic" ]; then
            VERMAGIC="$(cat "$KDIR/.vermagic")"

            echo "Actual vermagic:"
            echo "$VERMAGIC"
          else
            echo "WARNING: .vermagic not found."
          fi

          echo
          echo "--- kernel.release ---"

          if [ -f "$KDIR/include/config/kernel.release" ]; then
            cat "$KDIR/include/config/kernel.release"
          else
            echo "kernel.release not found"
          fi

          echo
          echo "========================================"
          echo "EXPECTED OFFICIAL OPENWRT ABI"
          echo "========================================"

          echo "6.12.94-1-d945e97e7385a33292d68bb31d85cb74"

          echo
          echo "NOTE:"
          echo "ABI mismatch is currently informational."
          echo "The build will continue."
      
      # ============================================================
      # Build complete firmware
      # ============================================================

      - name: Build firmware
        run: |
          cd openwrt

          echo "========================================"
          echo "BUILDING FIRMWARE"
          echo "========================================"

          make -j$(nproc) || make -j1 V=s

      # ============================================================
      # Inspect final manifest
      # ============================================================

      - name: Inspect final firmware
        run: |
          cd openwrt

          echo "========================================"
          echo "TARGET FILES"
          echo "========================================"

          find bin/targets/imx/cortexa7 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "========================================"
          echo "IMAGE MANIFESTS"
          echo "========================================"

          for manifest in bin/targets/imx/cortexa7/*.manifest; do
            if [ -f "$manifest" ]; then
              echo
              echo "===== $manifest ====="
              cat "$manifest"
            fi
          done

      # ============================================================
      # Check requested packages
      # ============================================================

      - name: Check required packages
        run: |
          cd openwrt

          echo "========================================"
          echo "CHECKING REQUIRED PACKAGES"
          echo "========================================"

          MANIFESTS="bin/targets/imx/cortexa7/*.manifest"

          for pkg in \
            kmod-brcmfmac \
            kmod-button-hotplug \
            kmod-input-gpio-keys \
            kmod-leds-gpio \
            kmod-pps-gpio \
            kmod-fs-vfat \
            kmod-phy-micrel \
            wpa-supplicant \
            ca-certificates \
            hostapd \
            kmod-bluetooth \
            bluez-daemon \
            bluez-libs \
            bluez-utils
          do
            echo
            echo "--- $pkg ---"

            if grep -hE "^${pkg}([[:space:]]|$)" $MANIFESTS 2>/dev/null; then
              echo "FOUND"
            else
              echo "NOT FOUND"
            fi
          done

      # ============================================================
      # Final configuration
      # ============================================================

      - name: Save final configuration information
        run: |
          cd openwrt

          echo "========================================"
          echo "FINAL CONFIG"
          echo "========================================"

          grep '^CONFIG_TARGET_' .config | sort

          echo
          echo "========================================"
          echo "FINAL SDMA CONFIG"
          echo "========================================"

          KDIR="$(
            find build_dir \
              -type d \
              -path '*/linux-6.12.94' \
              | head -n1
          )"

          if [ -f "$KDIR/.config" ]; then
            grep -E \
              'CONFIG_(EXTRA_FIRMWARE|IMX_SDMA)' \
              "$KDIR/.config" \
              || true
          fi

          echo
          echo "========================================"
          echo "FINAL .config MD5"
          echo "========================================"

          md5sum .config

      # ============================================================
      # Generate release tag
      # ============================================================

      - name: Generate release tag
        id: tag
        run: |
          echo "tag=gtw360-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Publish release
      # ============================================================

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2

        with:
          tag_name: ${{ steps.tag.outputs.tag }}

          name: "OpenWrt GTW360 — ${{ github.event.inputs.branch }}"

          body: |
            OpenWrt build for Geniatech GTW360

            Base:
            `${{ github.event.inputs.branch }}`

            Target:
            `imx/cortexa7`

            Device:
            `geniatech_gtw360`

            Expected official kernel ABI:
            `6.12.94-1-d945e97e7385a33292d68bb31d85cb74`

            SDMA firmware:
            `imx/sdma/sdma-imx6q.bin`

          files: |
            openwrt/bin/targets/imx/cortexa7/*.bin
            openwrt/bin/targets/imx/cortexa7/*.manifest
            openwrt/.config

          fail_on_unmatched_files: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
