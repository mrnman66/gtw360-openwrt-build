name: Build OpenWrt Custom Firmware

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Official OpenWrt tag (e.g., v25.12.5)'
        required: true
        default: 'v25.12.5'

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-dev python3-pyelftools \
            unzip wget python3-setuptools rsync subversion swig time xsltproc zlib1g-dev

      - name: Clone official OpenWrt
        run: |
          echo "Cloning OpenWrt tag: ${{ github.event.inputs.branch }}"

          git clone \
            --depth 1 \
            https://github.com/openwrt/openwrt.git \
            -b "${{ github.event.inputs.branch }}" \
            openwrt

          if [ ! -f "openwrt/scripts/feeds" ]; then
            echo "ERROR: Tag '${{ github.event.inputs.branch }}' not found or clone failed!"
            exit 1
          fi

      - name: Copy custom files
        run: |
          if [ -d "custom" ] && [ "$(ls -A custom)" ]; then
            echo "Copying custom files to OpenWrt tree..."
            rsync -av custom/ openwrt/
          else
            echo "WARNING: custom/ folder is missing or empty."
          fi

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate configuration
        run: |
          cd openwrt

          OPENWRT_TAG="${{ github.event.inputs.branch }}"
          OPENWRT_VERSION="${OPENWRT_TAG#v}"

          CONFIG_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/imx/cortexa7/config.buildinfo"

          echo "Downloading official config:"
          echo "${CONFIG_URL}"

          wget "${CONFIG_URL}" -O .config

          if [ ! -s ".config" ]; then
            echo "ERROR: config.buildinfo download failed!"
            exit 1
          fi

          echo "Official config downloaded."

          sed -i '/^CONFIG_TARGET_DEVICE_imx_cortexa7_DEVICE_technexion_imx7d-pico-pi=y$/d' .config
          sed -i '/^CONFIG_TARGET_DEVICE_PACKAGES_imx_cortexa7_DEVICE_technexion_imx7d-pico-pi=/d' .config

          echo "CONFIG_TARGET_imx_cortexa7_DEVICE_geniatech_gtw360=y" >> .config

          echo "Running make defconfig..."
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Show target files
        run: |
          cd openwrt

          echo "===== BUILD OUTPUT ====="
          ls -lah bin/targets/imx/cortexa7/

          echo
          echo "===== ZIMAGE ====="
          ls -lah bin/targets/imx/cortexa7/*-zImage 2>/dev/null || true

          echo
          echo "===== MANIFEST ====="
          ls -lah bin/targets/imx/cortexa7/*.manifest 2>/dev/null || true

      - name: Generate release tag
        id: tag
        run: |
          echo "tag=$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "OpenWrt GTW360 — ${{ github.event.inputs.branch }}"
          body: |
            Custom OpenWrt build for Geniatech GTW360

            - Base OpenWrt tag: `${{ github.event.inputs.branch }}`
            - Target: `imx/cortexa7`
            - Device: `geniatech_gtw360`
            - Configuration: official `config.buildinfo`
            - Date: `${{ steps.tag.outputs.tag }}`

          files: |
            openwrt/bin/targets/imx/cortexa7/*.bin
            openwrt/bin/targets/imx/cortexa7/*.manifest
            openwrt/bin/targets/imx/cortexa7/*-zImage
            openwrt/.config

          fail_on_unmatched_files: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
